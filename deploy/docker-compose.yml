# bmsync — single-container deployment
#
#   cp .env.example .env && fill in BMSYNC_TOKEN
#   docker compose up -d --build
#
# Reverse proxy (TLS certs / HTTPS termination) is handled by Nginx Proxy
# Manager; this project ships no proxy layer. See docs/architecture.md §9.

services:
  bmsync:
    build:
      # Context must be the repo root: the cross-side HLC vectors
      # test/hlc_vectors.json live outside bmsync/, and the Domain tests
      # locate them by walking up from the binary dir (see
      # HlcTests.VectorsPath). A bmsync/-only context would exclude the
      # vectors and fail those two tests.
      context: ..
      dockerfile: bmsync/Dockerfile
    container_name: bmsync
    restart: unless-stopped
    environment:
      BMSYNC_TOKEN: ${BMSYNC_TOKEN:?Set BMSYNC_TOKEN in .env}
      BMSYNC_DATA: /data
      BMSYNC_ADDR: ":8080"
      BMSYNC_HISTORY_KEEP: ${BMSYNC_HISTORY_KEEP:-30}
      BMSYNC_TOMBSTONE_TTL_DAYS: ${BMSYNC_TOMBSTONE_TTL_DAYS:-90}
    volumes:
      - ./data:/data
    # Bind loopback only; no direct public access. NPM proxies via host 8080.
    # If NPM runs on another machine, use the LAN IP, e.g. "192.168.1.10:8080:8080".
    ports:
      - "127.0.0.1:18081:8080"
    networks: [bmsync]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # Scratch image has no shell / wget; use the binary's own subcommand
      test: ["CMD", "/bmsync", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  bmsync:
