<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BM Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1><img class="brand-icon" src="../icon.png" alt="" width="24" height="24" />BM Sync</h1>
      <button id="sync" class="primary">Sync now</button>

      <p id="status" class="muted">Reading state…</p>
      <p id="last-sync" class="meta">Last sync: never</p>
      <p id="cached" class="meta"></p>

      <p id="first-run" class="hint" hidden>
        First run needs the server URL and access token configured.
      </p>

      <div id="notices" hidden>
        <p id="clock-warning" class="warn"></p>
        <p id="conflicts" class="warn"></p>
        <p id="warnings" class="warn"></p>
      </div>
    </main>

    <footer>
      <button id="open-options" class="link">Settings</button>
      <button id="view-conflicts" class="link">Conflicts &amp; history</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
